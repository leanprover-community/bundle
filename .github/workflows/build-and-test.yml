name: Build and Test Bundle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Project repository URL'
        required: false
        default: 'https://github.com/PatrickMassot/MDD154'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: pytest tests/test_import_closure.py -v

  build-bundle:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/PatrickMassot/MDD154' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Clone and build project
        run: |
          git clone --depth=1 "$REPO_URL" /tmp/project
          cd /tmp/project
          lake exe cache get || true
          lake build

      - name: Build Windows bundle
        run: |
          python bundle.py "$REPO_URL" \
            --project-dir /tmp/project \
            --platform windows-x64 \
            --work-dir /tmp/bundle-work \
            --output /tmp/bundle.zip

      - name: Report bundle size
        run: |
          ls -lh /tmp/bundle.zip
          du -sh /tmp/bundle-work/*/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows-x64
          path: /tmp/bundle.zip
          retention-days: 7

  test-windows:
    runs-on: windows-latest
    needs: build-bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: bundle-windows-x64

      - name: Extract bundle
        run: Expand-Archive -Path bundle.zip -DestinationPath bundle

      - name: Find bundle root
        id: find-root
        shell: pwsh
        run: |
          $root = Get-ChildItem -Path bundle -Directory | Select-Object -First 1
          echo "BUNDLE_ROOT=$($root.FullName)" >> $env:GITHUB_OUTPUT
          echo "Bundle root: $($root.FullName)"
          Get-ChildItem $root.FullName

      # --- Tier 1: Structural integrity ---
      - name: "Tier 1: Verify bundle structure"
        shell: pwsh
        run: |
          python tests/verify_bundle.py "${{ steps.find-root.outputs.BUNDLE_ROOT }}" --platform windows-x64

      # --- Existing: lean binary test ---
      - name: Test lean binary
        shell: pwsh
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          $env:PATH = "$root\lean\bin;$env:PATH"
          lean --version

      - name: Build LEAN_PATH
        id: lean-path
        shell: pwsh
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          $leanPath = "$root\lean\lib\lean;$root\project\.lake\build\lib\lean"
          Get-ChildItem "$root\project\.lake\packages" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $buildDir = Join-Path $_.FullName ".lake\build\lib\lean"
            if (Test-Path $buildDir) {
              $leanPath += ";$buildDir"
            }
          }
          echo "LEAN_PATH=$leanPath" >> $env:GITHUB_OUTPUT

      # --- Tier 2: lake build --no-build ---
      # Manifest is rewritten to path deps so lake doesn't need git.
      - name: "Tier 2: lake build --no-build"
        shell: pwsh
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          $env:PATH = "$root\lean\bin;$env:PATH"
          $env:LEAN_PATH = "${{ steps.lean-path.outputs.LEAN_PATH }}"
          $env:ELAN_HOME = "$root\lean"
          cd "$root\project"
          lake build --no-build 2>&1 | Select-Object -First 50

      # --- Tier 3: LSP protocol test ---
      - name: "Tier 3: LSP protocol test"
        shell: pwsh
        timeout-minutes: 3
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"

          # Find a .lean file in the project (not lakefile, not .lake)
          $leanFile = Get-ChildItem "$root\project" -Recurse -Filter "*.lean" |
            Where-Object { $_.FullName -notlike "*\.lake*" -and $_.FullName -notlike "*lakefile*" } |
            Select-Object -First 1

          if ($leanFile) {
            python tests/test_lsp.py `
              "$root\lean\bin" `
              "${{ steps.lean-path.outputs.LEAN_PATH }}" `
              "$($leanFile.FullName)" `
              --timeout 120
          } else {
            echo "::warning::No .lean files found"
          }

      # --- Tier 4: Launcher script environment test ---
      - name: "Tier 5: Launcher environment test"
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set BUNDLE_ROOT=${{ steps.find-root.outputs.BUNDLE_ROOT }}

          :: Simulate what Start Lean.cmd does (without launching VSCodium)
          set PATH=%BUNDLE_ROOT%\lean\bin;%PATH%
          set ELAN_HOME=%BUNDLE_ROOT%\lean
          set LEAN_PATH=%BUNDLE_ROOT%\lean\lib\lean;%BUNDLE_ROOT%\project\.lake\build\lib\lean
          for /d %%P in ("%BUNDLE_ROOT%\project\.lake\packages\*") do (
              if exist "%%P\.lake\build\lib\lean" (
                  set LEAN_PATH=!LEAN_PATH!;%%P\.lake\build\lib\lean
              )
          )

          :: Verify environment
          echo === Checking PATH ===
          where lean.exe
          if errorlevel 1 (
              echo FAIL: lean.exe not found in PATH
              exit /b 1
          )

          echo === Checking ELAN_HOME ===
          echo ELAN_HOME=%ELAN_HOME%
          if not exist "%ELAN_HOME%" (
              echo FAIL: ELAN_HOME does not exist
              exit /b 1
          )

          echo === Checking LEAN_PATH entries ===
          set FAIL=0
          for %%D in ("%LEAN_PATH:;=" "%") do (
              if exist %%D (
                  echo OK: %%D
              ) else (
                  echo FAIL: %%D does not exist
                  set FAIL=1
              )
          )
          if %FAIL%==1 exit /b 1

          echo === All launcher environment checks passed ===
