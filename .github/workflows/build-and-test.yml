name: Build and Test Bundle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Project repository URL'
        required: false
        default: 'https://github.com/PatrickMassot/MDD154'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: pytest tests/ -v

  build-project:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/PatrickMassot/MDD154' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.1/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Clone and build project
        # Tier 6 GUI tests assert on specific file content (f01_egalites.lean line 44).
        # Pin the default project to a known commit so upstream changes don't break tests.
        run: |
          git clone "$REPO_URL" /tmp/project
          cd /tmp/project
          git checkout 1f32d8e95f5567c9aabcd55297840bda340ad913 2>/dev/null || true
          lake exe cache get || true
          lake build

      - name: Archive built project
        run: tar cf /tmp/project.tar -C /tmp project

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-project
          path: /tmp/project.tar
          retention-days: 1

  build-windows:
    runs-on: ubuntu-latest
    needs: build-project
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/PatrickMassot/MDD154' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-project

      - name: Extract project
        run: tar xf project.tar -C /tmp

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.1/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Windows bundle
        run: |
          python bundle.py "$REPO_URL" \
            --project-dir /tmp/project \
            --platform windows-x64 \
            --work-dir /tmp/bundle-work \
            --output /tmp/bundle.zip

      - name: Report bundle size
        run: |
          ls -lh /tmp/bundle.zip
          du -sh /tmp/bundle-work/*/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-windows-x64
          path: /tmp/bundle.zip
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    needs: build-project
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/PatrickMassot/MDD154' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-project

      - name: Extract project
        run: tar xf project.tar -C /tmp

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.1/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Linux bundle
        run: |
          python bundle.py "$REPO_URL" \
            --project-dir /tmp/project \
            --platform linux-x64 \
            --work-dir /tmp/bundle-work \
            --output /tmp/bundle-linux.zip

      - name: Report bundle size
        run: |
          ls -lh /tmp/bundle-linux.zip
          du -sh /tmp/bundle-work/*/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-linux-x64
          path: /tmp/bundle-linux.zip
          retention-days: 7

  build-macos-arm64:
    runs-on: ubuntu-latest
    needs: build-project
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/PatrickMassot/MDD154' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-project

      - name: Extract project
        run: tar xf project.tar -C /tmp

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.1/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build macOS arm64 bundle
        run: |
          python bundle.py "$REPO_URL" \
            --project-dir /tmp/project \
            --platform darwin-arm64 \
            --work-dir /tmp/bundle-work \
            --output /tmp/bundle-macos-arm64.zip

      - name: Report bundle size
        run: |
          ls -lh /tmp/bundle-macos-arm64.zip
          du -sh /tmp/bundle-work/*/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-darwin-arm64
          path: /tmp/bundle-macos-arm64.zip
          retention-days: 7

  test-linux-offline:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: "Preflight: verify network isolation works"
        run: |
          if unshare -rn -- true 2>/dev/null; then
            echo "Using: unshare -rn"
          elif sudo -n unshare --net -- true 2>/dev/null; then
            echo "Using: sudo unshare --net"
          else
            echo "::error::Neither 'unshare -rn' nor 'sudo unshare --net' works"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-linux-x64

      - name: Extract bundle
        run: |
          mkdir bundle
          cd bundle
          unzip ../bundle-linux.zip

      - name: Find bundle root
        id: find-root
        run: |
          root=$(find bundle -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "BUNDLE_ROOT=$(pwd)/$root" >> "$GITHUB_OUTPUT"
          echo "Bundle root: $(pwd)/$root"
          ls "$(pwd)/$root"

      - name: Fix olean timestamps after unzip
        run: |
          find "${{ steps.find-root.outputs.BUNDLE_ROOT }}" \( -name '*.olean' -o -name '*.ilean' \) -exec touch {} +

      # --- Tier 1: Structural integrity ---
      - name: "Tier 1: Verify bundle structure"
        run: |
          python tests/verify_bundle.py "${{ steps.find-root.outputs.BUNDLE_ROOT }}" --platform linux-x64

      # --- Tier 2+3 offline: lake and LSP with network disabled ---
      - name: Install pytest
        run: pip install pytest

      - name: "Offline: Run offline guarantee tests"
        timeout-minutes: 5
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          python -m pytest tests/test_offline.py -v

  test-linux-gui:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-linux-x64

      - name: Extract bundle
        run: |
          mkdir bundle
          cd bundle
          unzip ../bundle-linux.zip

      - name: Find bundle root
        id: find-root
        run: |
          root=$(find bundle -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "BUNDLE_ROOT=$(pwd)/$root" >> "$GITHUB_OUTPUT"
          echo "Bundle root: $(pwd)/$root"

      - name: Fix olean timestamps after unzip
        run: |
          find "${{ steps.find-root.outputs.BUNDLE_ROOT }}" \( -name '*.olean' -o -name '*.ilean' \) -exec touch {} +

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: "Tier 6: Install Playwright test deps"
        run: |
          cd tests/gui-playwright
          npm ci

      - name: "Tier 6: UI automation tests (infoview + interaction)"
        timeout-minutes: 15
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          cd tests/gui-playwright
          xvfb-run --auto-servernum npx playwright test --reporter=list

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tier6-screenshots-linux
          path: tests/gui-playwright/test-results/
          retention-days: 30

  test-windows:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-windows-x64

      - name: Extract bundle
        run: Expand-Archive -Path bundle.zip -DestinationPath bundle

      - name: Find bundle root
        id: find-root
        shell: pwsh
        run: |
          $root = Get-ChildItem -Path bundle -Directory | Select-Object -First 1
          echo "BUNDLE_ROOT=$($root.FullName)" >> $env:GITHUB_OUTPUT
          echo "Bundle root: $($root.FullName)"
          Get-ChildItem $root.FullName

      - name: Fix olean timestamps after unzip
        shell: pwsh
        run: |
          Get-ChildItem "${{ steps.find-root.outputs.BUNDLE_ROOT }}" -Recurse -Include *.olean,*.ilean | ForEach-Object { $_.LastWriteTime = Get-Date }

      # --- Tier 1: Structural integrity ---
      - name: "Tier 1: Verify bundle structure"
        shell: pwsh
        run: |
          python tests/verify_bundle.py "${{ steps.find-root.outputs.BUNDLE_ROOT }}" --platform windows-x64

      # --- Existing: lean binary test ---
      - name: Test lean binary
        shell: pwsh
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          $env:PATH = "$root\lean\bin;$env:PATH"
          lean --version

      - name: Build LEAN_PATH
        id: lean-path
        shell: pwsh
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          $leanPath = "$root\lean\lib\lean;$root\project\.lake\build\lib\lean"
          Get-ChildItem "$root\project\.lake\packages" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $buildDir = Join-Path $_.FullName ".lake\build\lib\lean"
            if (Test-Path $buildDir) {
              $leanPath += ";$buildDir"
            }
          }
          echo "LEAN_PATH=$leanPath" >> $env:GITHUB_OUTPUT

      # --- Tier 2: lake build --no-build ---
      # Manifest is rewritten to path deps so lake doesn't need git.
      - name: "Tier 2: lake build --no-build"
        shell: pwsh
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          $env:PATH = "$root\lean\bin;$env:PATH"
          $env:LEAN_PATH = "${{ steps.lean-path.outputs.LEAN_PATH }}"
          $env:ELAN_HOME = "$root\lean"
          cd "$root\project"
          $ErrorActionPreference = 'Continue'
          lake build --no-build 2>&1 | Select-Object -First 50
          # Exit 3 = targets stale but not rebuilding (expected after zip/unzip)
          if ($LASTEXITCODE -notin 0,3) { exit $LASTEXITCODE }

      # --- Tier 3: LSP protocol test ---
      - name: "Tier 3: LSP protocol test"
        shell: pwsh
        timeout-minutes: 3
        run: |
          $root = "${{ steps.find-root.outputs.BUNDLE_ROOT }}"

          # Find a .lean file in the project (not lakefile, not .lake)
          $leanFile = Get-ChildItem "$root\project" -Recurse -Filter "*.lean" |
            Where-Object { $_.FullName -notlike "*\.lake*" -and $_.FullName -notlike "*lakefile*" } |
            Select-Object -First 1

          if ($leanFile) {
            python tests/lsp_smoke.py `
              "$root\lean\bin" `
              "${{ steps.lean-path.outputs.LEAN_PATH }}" `
              "$($leanFile.FullName)" `
              --timeout 120
          } else {
            echo "::warning::No .lean files found"
          }

      # --- Tier 4: Launcher script integration test ---
      - name: "Tier 4: Install pytest"
        run: pip install pytest

      - name: "Tier 4: Launcher script integration test"
        shell: pwsh
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          python -m pytest tests/test_launcher.py -v

      # --- Tier 5: VSCodium integration smoke test ---
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - name: "Tier 5: Install GUI test deps"
        shell: pwsh
        run: |
          cd tests/gui
          npm ci
          npx tsc

      - name: "Tier 5: VSCodium integration smoke test"
        shell: pwsh
        timeout-minutes: 8
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          cd tests/gui
          node out/run-tests.js

  deploy-screenshots:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test-linux-gui, test-macos-gui, test-windows-gui]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tier6-screenshots-linux
          path: site/linux

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: always()
        with:
          name: tier6-screenshots-macos
          path: site/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: always()
        with:
          name: tier6-screenshots-windows
          path: site/windows

      - name: Create index page
        run: |
          cat > site/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Lean 4 Bundle - GUI Test Screenshots</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 960px; margin: 0 auto; padding: 20px; }
              h1 { border-bottom: 1px solid #ddd; padding-bottom: 10px; }
              .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
              .grid figure { margin: 0; text-align: center; }
              .grid img { width: 100%; border: 1px solid #ccc; border-radius: 4px; }
              .grid figcaption { margin-top: 6px; font-size: 0.9em; color: #555; }
              .col-header { font-weight: bold; text-align: center; padding-bottom: 4px; border-bottom: 2px solid #888; }
            </style>
          </head>
          <body>
            <h1>Lean 4 Bundle - GUI Test Screenshots</h1>
            <p>Latest screenshots from Tier 6 Playwright GUI tests on <code>main</code>. Click any thumbnail for the full-size image.</p>
            <div class="grid">
              <div class="col-header">Linux</div>
              <div class="col-header">macOS</div>
              <div class="col-header">Windows</div>
              <figure><a href="linux/infoview-goals.png"><img src="linux/infoview-goals.png" alt="Linux infoview goals"></a><figcaption>Infoview goals</figcaption></figure>
              <figure><a href="macos/infoview-goals.png"><img src="macos/infoview-goals.png" alt="macOS infoview goals"></a><figcaption>Infoview goals</figcaption></figure>
              <figure><a href="windows/infoview-goals.png"><img src="windows/infoview-goals.png" alt="Windows infoview goals"></a><figcaption>Infoview goals</figcaption></figure>
              <figure><a href="linux/interaction-error.png"><img src="linux/interaction-error.png" alt="Linux diagnostics"></a><figcaption>Live diagnostics</figcaption></figure>
              <figure><a href="macos/interaction-error.png"><img src="macos/interaction-error.png" alt="macOS diagnostics"></a><figcaption>Live diagnostics</figcaption></figure>
              <figure><a href="windows/interaction-error.png"><img src="windows/interaction-error.png" alt="Windows diagnostics"></a><figcaption>Live diagnostics</figcaption></figure>
              <figure><a href="linux/project-exercise.png"><img src="linux/project-exercise.png" alt="Linux project"></a><figcaption>Project exercise</figcaption></figure>
              <figure><a href="macos/project-exercise.png"><img src="macos/project-exercise.png" alt="macOS project"></a><figcaption>Project exercise</figcaption></figure>
              <figure><a href="windows/project-exercise.png"><img src="windows/project-exercise.png" alt="Windows project"></a><figcaption>Project exercise</figcaption></figure>
            </div>
          </body>
          </html>
          INDEXEOF

      - name: Verify screenshots exist
        run: |
          for platform in linux macos windows; do
            for f in infoview-goals.png interaction-error.png project-exercise.png; do
              test -f "site/$platform/$f" || { echo "::warning::Missing screenshot: $platform/$f"; }
            done
          done

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  test-macos:
    runs-on: macos-latest
    needs: build-macos-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-darwin-arm64

      - name: Extract bundle
        run: |
          mkdir bundle
          python -c "
          import sys, zipfile; sys.path.insert(0, '.')
          from download import _safe_extract_zip
          from pathlib import Path
          with zipfile.ZipFile('bundle-macos-arm64.zip') as zf:
              _safe_extract_zip(zf, Path('bundle'))
          "

      - name: Find bundle root
        id: find-root
        run: |
          root=$(find bundle -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "BUNDLE_ROOT=$(pwd)/$root" >> "$GITHUB_OUTPUT"
          echo "Bundle root: $(pwd)/$root"
          ls "$(pwd)/$root"

      - name: Remove quarantine attributes
        run: xattr -cr "${{ steps.find-root.outputs.BUNDLE_ROOT }}"

      - name: Verify executable permissions survived zip round-trip
        run: |
          root="${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          fail=0
          for f in "$root/lean/bin/lean" "$root/lean/bin/lake" \
                   "$root/vscodium/VSCodium.app/Contents/MacOS/VSCodium" \
                   "$root/Start Lean.sh"; do
            if [ ! -x "$f" ]; then
              echo "::error::Not executable after unzip: $f"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi

      - name: Fix olean timestamps after unzip
        run: |
          find "${{ steps.find-root.outputs.BUNDLE_ROOT }}" \( -name '*.olean' -o -name '*.ilean' \) -exec touch {} +

      # --- Tier 1: Structural integrity ---
      - name: "Tier 1: Verify bundle structure"
        run: |
          python tests/verify_bundle.py "${{ steps.find-root.outputs.BUNDLE_ROOT }}" --platform darwin-arm64

      # --- Tier 1.5: lean binary test ---
      - name: Test lean binary
        run: |
          root="${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          export PATH="$root/lean/bin:$PATH"
          lean --version

      - name: Build LEAN_PATH
        id: lean-path
        run: |
          root="${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          lean_path="$root/lean/lib/lean:$root/project/.lake/build/lib/lean"
          for pkg_dir in "$root"/project/.lake/packages/*/; do
            if [ -d "$pkg_dir/.lake/build/lib/lean" ]; then
              lean_path="$lean_path:$pkg_dir/.lake/build/lib/lean"
            fi
          done
          echo "LEAN_PATH=$lean_path" >> "$GITHUB_OUTPUT"

      # --- Tier 2: lake build --no-build ---
      - name: "Tier 2: lake build --no-build"
        run: |
          root="${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          export PATH="$root/lean/bin:$PATH"
          export LEAN_PATH="${{ steps.lean-path.outputs.LEAN_PATH }}"
          export ELAN_HOME="$root/lean"
          cd "$root/project"
          lake build --no-build 2>&1 | head -50
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi

      # --- Tier 3: LSP protocol test ---
      - name: "Tier 3: LSP protocol test"
        timeout-minutes: 3
        run: |
          root="${{ steps.find-root.outputs.BUNDLE_ROOT }}"
          lean_file=$(find "$root/project" -name "*.lean" ! -path "*/.lake/*" ! -name "lakefile*" | head -1)
          if [ -n "$lean_file" ]; then
            python tests/lsp_smoke.py \
              "$root/lean/bin" \
              "${{ steps.lean-path.outputs.LEAN_PATH }}" \
              "$lean_file" \
              --timeout 120
          else
            echo "::warning::No .lean files found"
          fi

      # --- Tier 4: Launcher script integration test ---
      - name: "Tier 4: Install pytest"
        run: pip install pytest

      - name: "Tier 4: Launcher script integration test"
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          python -m pytest tests/test_launcher.py -v

      # --- Tier 5: VSCodium integration smoke test ---
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - name: "Tier 5: Install GUI test deps"
        run: |
          cd tests/gui
          npm ci
          npx tsc

      - name: "Tier 5: VSCodium integration smoke test"
        timeout-minutes: 8
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          cd tests/gui
          node out/run-tests.js

  test-macos-gui:
    runs-on: macos-latest
    needs: build-macos-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-darwin-arm64

      - name: Extract bundle
        run: |
          mkdir bundle
          python -c "
          import sys, zipfile; sys.path.insert(0, '.')
          from download import _safe_extract_zip
          from pathlib import Path
          with zipfile.ZipFile('bundle-macos-arm64.zip') as zf:
              _safe_extract_zip(zf, Path('bundle'))
          "

      - name: Find bundle root
        id: find-root
        run: |
          root=$(find bundle -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "BUNDLE_ROOT=$(pwd)/$root" >> "$GITHUB_OUTPUT"
          echo "Bundle root: $(pwd)/$root"

      - name: Remove quarantine attributes
        run: xattr -cr "${{ steps.find-root.outputs.BUNDLE_ROOT }}"

      - name: Fix olean timestamps after unzip
        run: |
          find "${{ steps.find-root.outputs.BUNDLE_ROOT }}" \( -name '*.olean' -o -name '*.ilean' \) -exec touch {} +

      - name: "Tier 6: Install Playwright test deps"
        run: |
          cd tests/gui-playwright
          npm ci

      - name: "Tier 6: UI automation tests (infoview + interaction)"
        timeout-minutes: 15
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          cd tests/gui-playwright
          npx playwright test --reporter=list

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tier6-screenshots-macos
          path: tests/gui-playwright/test-results/
          retention-days: 30

  test-windows-gui:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-windows-x64

      - name: Extract bundle
        run: Expand-Archive -Path bundle.zip -DestinationPath bundle

      - name: Find bundle root
        id: find-root
        shell: pwsh
        run: |
          $root = Get-ChildItem -Path bundle -Directory | Select-Object -First 1
          echo "BUNDLE_ROOT=$($root.FullName)" >> $env:GITHUB_OUTPUT
          echo "Bundle root: $($root.FullName)"

      - name: Fix olean timestamps after unzip
        shell: pwsh
        run: |
          Get-ChildItem "${{ steps.find-root.outputs.BUNDLE_ROOT }}" -Recurse -Include *.olean,*.ilean | ForEach-Object { $_.LastWriteTime = Get-Date }

      - name: "Tier 6: Install Playwright test deps"
        shell: pwsh
        run: |
          cd tests/gui-playwright
          npm ci

      - name: "Tier 6: UI automation tests (infoview + interaction)"
        timeout-minutes: 15
        shell: pwsh
        env:
          BUNDLE_ROOT: ${{ steps.find-root.outputs.BUNDLE_ROOT }}
        run: |
          cd tests/gui-playwright
          npx playwright test --reporter=list

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tier6-screenshots-windows
          path: tests/gui-playwright/test-results/
          retention-days: 30
